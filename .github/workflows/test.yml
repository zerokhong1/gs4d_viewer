name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # CPU-only install: no torch, gsplat, CUDA, Chrome or ../data_real, so run_all.py skips those items with a reason.
      - run: python -m pip install -r requirements.txt
      - run: python tests/run_all.py
