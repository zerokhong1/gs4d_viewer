name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install ruff==0.16.9
      - run: ruff check .

  test:
    name: tests (torch ${{ matrix.torch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # none: what the viewer itself needs; everything that needs torch, CUDA or ../data_real is skipped with a reason.
        # cpu:  CPU torch on top, so the converter tests (synthetic checkpoints) and GpuFrames on the CPU device run too.
        torch: [none, cpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - if: matrix.torch == 'cpu'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      # the browser checks (check_*.py) already run in the "none" job
      - run: python tests/run_all.py ${{ matrix.torch == 'cpu' && 'test_' || '' }}
